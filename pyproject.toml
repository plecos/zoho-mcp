[project]
name = "zoho-mcp"
version = "0.3.0"
description = "An MCP server exposing Zoho Mail, Calendar, Contacts, Tasks, Notes, and Bookmarks as LLM tools"
readme = "README.md"
authors = [
    { name = "Ken Salter", email = "plecos@thesalters.net" }
]
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
requires-python = ">=3.12"
dependencies = [
    "beautifulsoup4>=4.15.0",
    "httpx>=0.28.1",
    "keyring>=25.7.0",
    # Capped at <2 because 2.0.0 deletes `mcp.server.fastmcp` outright --
    # server.py's import fails at module load, so the cap is what the code
    # actually supports rather than caution. Lifting it is a port to
    # `mcp.server.mcpserver`'s MCPServer, not a version bump.
    "mcp>=1.28.1,<2",
    "python-dotenv>=1.2.2",
    "tzdata>=2026.3",
]

[project.scripts]
zoho-mcp = "zoho_mcp.server:main"
zoho-mcp-setup = "zoho_mcp.setup_auth:main"

[build-system]
requires = ["uv_build>=0.12.0,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=2.3.0",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "respx>=0.23.1",
    "ruff>=0.15.22",
    "time-machine>=3.2.0",
]

[tool.uv]
# Floor only, deliberately no upper bound. This file ships inside the .mcpb
# bundle, and the uv that reads it is the *user's* -- Claude Desktop supplies
# no uv of its own (confirmed: the extension's generated pyvenv.cfg recorded
# the same uv version as the one on the installing user's PATH). An upper
# bound is therefore a promise about software we don't control, and the day
# uv releases a new major every install and every CI run breaks at once, with
# an error about a constraint the user never wrote.
required-version = ">=0.11.29"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"

[tool.mypy]
python_version = "3.12"
files = ["src"]
disallow_untyped_defs = true
check_untyped_defs = true
