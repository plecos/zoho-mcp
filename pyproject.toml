[project]
name = "zoho-mcp"
version = "0.1.0"
description = "A vendor-agnostic MCP server exposing Zoho Mail and Calendar as LLM tools"
readme = "README.md"
authors = [
    { name = "Ken", email = "info@salterdiazsolutions.com" }
]
requires-python = ">=3.12"
dependencies = [
    "beautifulsoup4>=4.15.0",
    "httpx>=0.28.1",
    "keyring>=25.7.0",
    "mcp>=1.28.1",
]

[project.scripts]
zoho-mcp = "zoho_mcp.server:main"
zoho-mcp-setup = "zoho_mcp.setup_auth:main"

[build-system]
requires = ["uv_build>=0.11.29,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "respx>=0.23.1",
    "time-machine>=3.2.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
