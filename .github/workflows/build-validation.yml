name: Build Validation

# Release-readiness gate, not a deployment -- there is no hosting target yet.
# Confirms the package builds cleanly and its entry-point modules import
# without error.

on:
  push:
    branches: [main]
    tags: ["v*"]

# Least privilege, declared rather than inherited. These jobs only read the
# repo -- no job needs write access to anything. The repo-wide default is
# currently read too, but that is one API call away from becoming write, and
# nothing here would record that these workflows never needed it.
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v9.0.0
        with:
          enable-cache: true
      - run: uv build
      - run: |
          python -m venv /tmp/build-check
          /tmp/build-check/bin/pip install dist/*.whl
          /tmp/build-check/bin/python -c "import zoho_mcp.server; import zoho_mcp.setup_auth"
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/
